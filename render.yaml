services:
  - type: web
    name: brentaru-smartpark-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://brentaru-smartpark.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://brentaru-smartpark.onrender.com,http://localhost:3000
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_SENDER_NAME
        value: SmartPark
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false

  - type: web
    name: brentaru-smartpark
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://brentaru-smartpark-api.onrender.com/api
      - key: REACT_APP_SUPABASE_URL
        sync: false
      - key: REACT_APP_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
