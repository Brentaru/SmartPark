spring.application.name=smartpark

# Supabase PostgreSQL Configuration - Session Pooler
# IMPORTANT: Using session pooler for JDBC connections
# Get these from: https://app.supabase.com/project/YOUR_PROJECT/settings/database
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres.hxinvbaafgclfdjviztk
spring.datasource.password=Rj9bi41vL7VgwAYe

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings (recommended for Supabase)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Jackson datetime format configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

